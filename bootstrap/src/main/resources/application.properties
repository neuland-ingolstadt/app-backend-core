#
# Quarkus
#
quarkus.application.name=app-backend-core

quarkus.http.port=8080

quarkus.management.enabled=true
quarkus.management.port=9000

quarkus.smallrye-health.root-path=/
quarkus.smallrye-health.liveness-path=livez
quarkus.smallrye-health.readiness-path=readyz
quarkus.smallrye-health.startup-path=startedz

quarkus.banner.path=banner

#
# Index generated OpenAPI server interfaces from GitHub Packages so Quarkus REST
# discovers @Path / HTTP method annotations declared on those interfaces.
#
quarkus.index-dependency.backend-core-api.group-id=app.neuland
quarkus.index-dependency.backend-core-api.artifact-id=backend-core-api


#
# Database
# Dev/test: Quarkus Dev Services automatically starts Postgres (Docker / Podman required).
# Prod: set QUARKUS_DATASOURCE_JDBC_URL / USERNAME / PASSWORD.
#
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.telemetry=false

quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true

#
# THI news scraper (in-memory cache only, no persistence)
#
thi.news.url=https://www.thi.de/hochschule/aktuelles/presse/
thi.news.timeout-ms=10000
quarkus.cache.caffeine."thi-news".expire-after-write=30M

#
# Authentication
# Dev/test: local JWT configuration.
# Prod: JWT configuration is provided through environment variables.
#
%dev.mp.jwt.verify.issuer=test-issuer
%test.mp.jwt.verify.issuer=test-issuer

%prod.mp.jwt.verify.publickey.location=${JWT_JWKS_URL}
%prod.mp.jwt.verify.issuer=${JWT_ISSUER}

smallrye.jwt.path.groups=groups

#
# Logging
# Dev/test: keep logs human-readable
# Prod: renable JSON logging
#
%prod.quarkus.log.level=INFO
%prod.quarkus.log.console.json.enabled=true

%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false

quarkus.log.category."org.hibernate".level=WARN
quarkus.log.category."org.hibernate.SQL".level=WARN
quarkus.log.category."org.hibernate.orm.jdbc.bind".level=WARN

%prod.quarkus.http.access-log.enabled=true
%prod.quarkus.http.access-log.pattern=%m %U%q %s %D

#
# Tracing
#
quarkus.otel.traces.enabled=true

# Configured through the deployment environment
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4317}
quarkus.otel.exporter.otlp.traces.protocol=grpc

#
# Rate limiting
# Counter is per endpoint, shared by all clients. Key: <Class>/<method>/RateLimit/{value|window|windowUnit}
# dev/test: effectively unlimited
# prod: 100/min default, tunable via env var without rebuild
#
%prod.app.neuland.adapters.inbound.rest.roomreports.RoomReportResource/createRoomReport/RateLimit/value=${APP_RATE_LIMIT_ROOM_REPORTS_CREATE_PER_MINUTE:100}
%prod.app.neuland.adapters.inbound.rest.roomreports.RoomReportResource/createRoomReport/RateLimit/window=1
%prod.app.neuland.adapters.inbound.rest.roomreports.RoomReportResource/createRoomReport/RateLimit/windowUnit=MINUTES
%prod.app.neuland.adapters.inbound.rest.roomreports.RoomReportResource/resolveRoomReport/RateLimit/value=${APP_RATE_LIMIT_ROOM_REPORTS_RESOLVE_PER_MINUTE:100}
%prod.app.neuland.adapters.inbound.rest.roomreports.RoomReportResource/resolveRoomReport/RateLimit/window=1
%prod.app.neuland.adapters.inbound.rest.roomreports.RoomReportResource/resolveRoomReport/RateLimit/windowUnit=MINUTES

%dev.app.neuland.adapters.inbound.rest.roomreports.RoomReportResource/createRoomReport/RateLimit/value=100000
%dev.app.neuland.adapters.inbound.rest.roomreports.RoomReportResource/resolveRoomReport/RateLimit/value=100000

