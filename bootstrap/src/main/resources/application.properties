#
# Quarkus
#
quarkus.application.name=app-backend-core

quarkus.http.port=8080

quarkus.management.enabled=true
quarkus.management.port=9000

quarkus.smallrye-health.root-path=/
quarkus.smallrye-health.liveness-path=livez
quarkus.smallrye-health.readiness-path=readyz
quarkus.smallrye-health.startup-path=startedz

#
# Database
#
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/app-backend
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true
