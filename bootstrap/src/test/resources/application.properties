#
# Test configuration.
#
# Replaces src/main/resources/application.properties on the test classpath.
# Uses in-memory H2 so @QuarkusTest can start without Docker/Dev Services.
# REST tests mock use cases; schema is created by Hibernate for wiring only.
#
quarkus.application.name=app-backend-core
quarkus.default-locale=en-US

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.flyway.migrate-at-start=false
quarkus.hibernate-orm.schema-management.strategy=drop-and-create

quarkus.index-dependency.backend-core-api.group-id=app.neuland
quarkus.index-dependency.backend-core-api.artifact-id=backend-core-api


mp.jwt.verify.publickey.location=classpath:test-public-key.pem
mp.jwt.verify.issuer=test-issuer

smallrye.jwt.path.groups=groups
smallrye.jwt.sign.key.location=classpath:test-private-key.pem

app.neuland.adapters.inbound.rest.roomreports.RoomReportResource/createRoomReport/RateLimit/value=100000
app.neuland.adapters.inbound.rest.roomreports.RoomReportResource/resolveRoomReport/RateLimit/value=100000

thi.news.url=https://www.thi.de/hochschule/aktuelles/presse/
thi.news.timeout-ms=10000
quarkus.cache.caffeine."thi-news".expire-after-write=30M
