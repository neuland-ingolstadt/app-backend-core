#
# Test configuration.
#
# Replaces src/main/resources/application.properties on the test classpath, so
# the main file is not merged. Persistence stays configured to keep the runtime
# wiring identical to production, but startup no longer touches a database:
# Flyway is disabled and Hibernate performs no schema work. Adapter tests mock
# the use case, so no connection is required.
#
quarkus.application.name=app-backend-core

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/app-backend
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.devservices.enabled=false

quarkus.flyway.migrate-at-start=false

quarkus.hibernate-orm.schema-management.strategy=validate
